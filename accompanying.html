<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Accompanying</title>
<style>
:root{
  --bg:#FAFAF8; --bg2:#F3F1EC; --bg3:#EAE8E2; --border:#E4E1D8; --text:#1C1B18; --text2:#5C5A52; --text3:#8C8A85;
  --accent:#4A6741; --accent-dk:#34492E; --accent-lt:#E8EDE4; --r:10px;
}
*{box-sizing:border-box}
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:var(--bg3);color:var(--text);line-height:1.5}
.wrap{max-width:640px;margin:0 auto;padding:1.5rem 1.25rem 4rem}
h1{font-size:1.6rem;font-weight:600;margin:0 0 .25rem}
.tagline{color:var(--text2);font-size:14px;margin-bottom:1.5rem}
.eyebrow{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--text3);font-weight:600}
.card{background:#fff;border:0.5px solid var(--border);border-radius:var(--r);padding:1rem 1.1rem;margin-bottom:1rem}
.card-sm{background:var(--bg2);border:0.5px solid var(--border);border-radius:8px;padding:.75rem;margin-bottom:.6rem}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:0.5px solid var(--border);
  border-radius:8px;padding:.6rem 1rem;font-size:14px;cursor:pointer;background:var(--bg2);color:var(--text);
  font-family:inherit;text-decoration:none}
.btn-primary{background:var(--accent);color:#fff;border-color:var(--accent)}
.btn-block{width:100%;margin-bottom:.6rem}
.btn-sm{padding:.4rem .75rem;font-size:13px}
.field-group{margin-bottom:1rem}
.field-label{display:block;font-size:13px;font-weight:500;margin-bottom:.35rem}
.field-hint{font-size:12px;color:var(--text3);margin-top:.25rem}
select,textarea,input[type=text]{width:100%;padding:.55rem .6rem;border:0.5px solid var(--border);border-radius:8px;
  font-family:inherit;font-size:14px;background:#fff;color:var(--text)}
textarea{min-height:70px;resize:vertical}
.guide-q{font-style:italic;color:var(--accent-dk);font-size:14px;margin:.25rem 0 1rem}
.mode-choice{display:flex;flex-direction:column;gap:.75rem;margin-top:1.5rem}
.mode-btn{display:block;text-align:left;padding:1.1rem;border-radius:var(--r);border:0.5px solid var(--border);
  background:#fff;cursor:pointer;font-family:inherit}
.mode-btn:hover{border-color:var(--accent)}
.mode-btn .t{font-weight:600;font-size:15px;margin-bottom:2px}
.mode-btn .d{font-size:13px;color:var(--text2)}
.pill{display:inline-block;font-size:11px;padding:2px 8px;border-radius:12px;background:var(--accent-lt);color:var(--accent-dk)}
.section-label{font-size:12px;font-weight:600;color:var(--text3);text-transform:uppercase;letter-spacing:.04em;margin:1.25rem 0 .5rem}
.back-link{background:none;border:none;color:var(--accent);font-size:13px;cursor:pointer;padding:2px 0;margin-bottom:1rem;display:block}
.compare-row{display:grid;grid-template-columns:1fr 1fr;gap:.6rem;margin-bottom:.75rem}
@media(max-width:520px){.compare-row{grid-template-columns:1fr}}
.compare-col{background:var(--bg2);border-radius:8px;padding:.6rem}
.compare-col .lbl{font-size:11px;text-transform:uppercase;letter-spacing:.03em;color:var(--text3);margin-bottom:.25rem}
.empty-state{color:var(--text3);font-size:13px;padding:1rem;text-align:center}
textarea#snapshotOut{font-family:ui-monospace,Menlo,monospace;font-size:12px}
.top-actions{display:flex;justify-content:space-between;align-items:center;margin-bottom:1rem}

/* -- Header / Footer (aligned with Being & Becoming) -- */
.hdr{background:var(--accent);padding:0 1.5rem;display:flex;align-items:center;
  justify-content:flex-start;height:54px}
.hdr-inner{position:relative;padding-left:46px}
.hdr-brand{color:#CFDBC7;font-size:12px;font-weight:500;letter-spacing:.06em;text-transform:uppercase}
.hdr-title{color:#fff;font-size:17px;font-weight:500}
@media (max-width:480px){
  .hdr-brand{display:none}
  .hdr-title{font-size:15px}
  .hdr img[alt=""]{height:30px}
}
.app-footer{text-align:center;padding:1.25rem 1.5rem 1.5rem;font-size:11px;color:var(--text3);border-top:0.5px solid var(--border);margin-top:1rem}
.manage-row{display:flex;align-items:center;gap:8px;padding:.625rem .75rem;border:0.5px solid var(--border);
  border-radius:var(--r);margin-bottom:.5rem;background:#fff;cursor:pointer;font-family:inherit;width:100%;text-align:left}
.manage-row:hover{border-color:var(--accent)}
.manage-row-title{flex:1;font-size:13px}
.manage-row-meta{font-size:11px;color:var(--text3)}
</style>
</head>

</header>
<div class="wrap" id="app"></div>
<footer class="app-footer">© <span id="footerYear"></span> Iain MacMillan / What Now? What Next?. All rights reserved.</footer>
<script>
/* ══════════════════════════════════════════════════════════════
   ACCOMPANYING — a standalone companion to Being & Becoming, for
   figuring out what kind of accountability partner would genuinely
   serve a specific coachee, and checking a prospective partner's
   own self-assessment against that. Same architecture as B&B:
   single file, localStorage only, JSON export/import between the
   two roles — nothing sent anywhere, nothing shared except the
   files people deliberately hand to each other.
   ══════════════════════════════════════════════════════════════ */

// ── Data: the 8 trait-defining dimensions, their answer options,
// and what each answer implies for partner fit. Source: the
// Accountability Partner Matching workbook.
const DIMENSIONS = [
  { id:'saboteur', label:'Your most common self-defeating pattern', guideQ:"When you're at your worst, which of these sounds most like you?",
    options:['Avoider','Controller','Hyper-Achiever','Hyper-Rational','Hyper-Vigilant','Pleaser','Stickler','Restless','Victim','Not sure'],
    optionLabels:{
      'Avoider':'Avoiding conflict and difficult tasks (sometimes called \u2018Avoider\u2019)',
      'Controller':'Needing to be in control and take charge (\u2018Controller\u2019)',
      'Hyper-Achiever':'Tying your self-worth to constant achievement (\u2018Hyper-Achiever\u2019)',
      'Hyper-Rational':'Over-relying on logic, at the cost of emotion (\u2018Hyper-Rational\u2019)',
      'Hyper-Vigilant':'Constant worry about what could go wrong (\u2018Hyper-Vigilant\u2019)',
      'Pleaser':'Needing to be liked, at the cost of your own needs (\u2018Pleaser\u2019)',
      'Stickler':'Perfectionism and self-criticism (\u2018Stickler\u2019)',
      'Restless':'Constantly chasing the next thing, rarely settled (\u2018Restless\u2019)',
      'Victim':'Feeling like things happen to you, rather than because of you (\u2018Victim\u2019)',
      'Not sure':'Not sure',
    } },
  { id:'zone', label:'Zone tendency', guideQ:"Left to your own devices, do you tend to take on more than's comfortable, or play it safe?",
    options:['Tends to under-stretch (stays comfortable)','Leans toward under-stretching, more often than not','Balanced — moves between both','Leans toward over-stretching, more often than not','Tends to over-stretch (takes on too much)'] },
  { id:'challenge', label:'Response to challenge', guideQ:'When someone pushes back on you directly, what\'s your honest first reaction?',
    options:['Tends to shut down or withdraw','Gets defensive','Wants feedback delivered gently','Wants feedback delivered directly, no cushioning','Genuinely fine either way'] },
  { id:'processing', label:'Processing style', guideQ:"When you're working through something difficult, do you think better out loud with someone, or alone in your own head?",
    options:['Internal — needs quiet to think it through','Mostly internal, but sometimes talks it through','Depends on the situation','Mostly external, but sometimes needs quiet first','External — thinks out loud, needs to talk it through'] },
  { id:'followthrough', label:'Follow-through tendency', guideQ:"Once you've committed to something for yourself, how reliably do you follow through without anyone checking in?",
    options:['Reliably follows through alone','Usually follows through alone, occasionally needs a nudge','Sometimes needs a nudge','Often needs a nudge or check-in to follow through','Genuinely needs external structure to follow through'] },
  { id:'vulnerability', label:'Comfort with vulnerability', guideQ:"How much are you comfortable letting this person see when things aren't going well?",
    options:['Very guarded — shares only once fully processed','Somewhat guarded — needs real trust before opening up','Moderately open — will share if asked directly','Fairly open — shares fairly readily, without much prompting','Very open — processes out loud, including the messy parts'] },
  { id:'selfcriticism', label:'Self-criticism tendency', guideQ:"When you fall short of something you wanted to do, are you hard on yourself, or do you let it go easily?",
    options:['Very hard on myself when I fall short','Fairly hard on myself, but recovers with time','Somewhat hard on myself, but recovers','Mildly hard on myself, mostly lets it go','Lets it go fairly easily'] },
  { id:'seekshelp', label:'Seeks vs. resists help', guideQ:"When you're struggling, do you tend to ask for help, or wait until it's offered?",
    options:['Asks for help readily','Usually asks for help without too much delay','Only asks once things are already difficult','Rarely asks, mostly waits to be checked on','Resists asking until help is offered'] },
];

const RECOMMENDATION = {
  saboteur: {
    'Stickler': "A partner who won't reinforce self-criticism, but will gently name perfectionism when it shows up. Avoid pairing with another Stickler.",
    'Pleaser': "A partner who will genuinely challenge and push back, not just validate. Avoid pairing with another Pleaser.",
    'Avoider': "A partner skilled at naming avoidance directly, without triggering withdrawal.",
    'Controller': "A partner who won't simply defer or be intimidated — comfortable holding their own ground.",
    'Hyper-Achiever': "A partner who asks about wellbeing and process, not just outcomes — helps value the journey, not only the win.",
    'Restless': "A partner who helps them stay with one thing, rather than enabling scattergun switching.",
    'Victim': "A partner who validates feeling without dwelling, and redirects toward agency and choice.",
    'Hyper-Vigilant': "A calm partner who doesn't amplify anxiety, and helps distinguish real risk from perceived risk.",
    'Hyper-Rational': "A partner comfortable naming and normalising emotion, not just logic.",
    'Not sure': "No strong steer yet from this dimension — default to the universal qualities only.",
  },
  zone: {
    'Tends to under-stretch (stays comfortable)': "A partner who will genuinely challenge and push, not just validate comfort.",
    'Leans toward under-stretching, more often than not': "A partner who nudges toward stretch a little more often than not, without ever forcing it.",
    'Balanced — moves between both': "A partner who can flex either way as the moment calls for it.",
    'Leans toward over-stretching, more often than not': "A partner who's comfortable pulling back sometimes, even if push is still usually the right call.",
    'Tends to over-stretch (takes on too much)': "A partner skilled at pulling back and giving explicit permission to do less, not just cheerleading more stretch.",
  },
  challenge: {
    'Tends to shut down or withdraw': "A partner who delivers feedback gently, and checks in afterwards on how it landed.",
    'Gets defensive': "A partner with strong non-judgment skills — reflects before responding, doesn't escalate.",
    'Wants feedback delivered gently': "A partner who softens delivery and leads with warmth.",
    'Wants feedback delivered directly, no cushioning': "A partner comfortable being blunt, without over-cushioning.",
    'Genuinely fine either way': "Flexible on this front — not a major constraint on partner choice.",
  },
  processing: {
    'Internal — needs quiet to think it through': "A partner genuinely comfortable with silence — doesn't fill every pause.",
    'Mostly internal, but sometimes talks it through': "A partner who gives space by default but is ready to talk it through if invited.",
    'Depends on the situation': "A partner who can read the room and flex between the two.",
    'Mostly external, but sometimes needs quiet first': "A partner who's a willing thinking partner most of the time, but knows when to just listen quietly.",
    'External — thinks out loud, needs to talk it through': "A partner willing to actively think out loud alongside them, like a real thinking partner.",
  },
  followthrough: {
    'Reliably follows through alone': "Follow-through is less of a constraint — the relationship can be lighter-touch.",
    'Usually follows through alone, occasionally needs a nudge': "A partner who checks in occasionally, more as a courtesy than a necessity.",
    'Sometimes needs a nudge': "A partner who checks in periodically, without becoming a taskmaster.",
    'Often needs a nudge or check-in to follow through': "A partner who checks in fairly regularly — follow-through is a real factor here.",
    'Genuinely needs external structure to follow through': "A partner whose own follow-through and memory for commitments is strong — 'remembers the thread' becomes critical here, not just nice-to-have. Consider a more formal, scheduled rhythm.",
  },
  vulnerability: {
    'Very guarded — shares only once fully processed': "A partner who is patient, doesn't push for disclosure, and is willing to go first themselves to build trust.",
    'Somewhat guarded — needs real trust before opening up': "A partner who builds trust steadily and doesn't take guardedness personally.",
    'Moderately open — will share if asked directly': "A partner who asks directly, rather than waiting to be told.",
    'Fairly open — shares fairly readily, without much prompting': "A partner who's comfortable receiving a fair amount of openness without over-reacting.",
    'Very open — processes out loud, including the messy parts': "A partner who can hold a lot without over-reacting or trying to fix everything at once.",
  },
  selfcriticism: {
    'Very hard on myself when I fall short': "A partner with strong non-judgment and curiosity skills is essential here — likely the single most important trait for this person specifically.",
    'Fairly hard on myself, but recovers with time': "A partner with strong non-judgment skills matters a lot here, even if not quite the single defining trait.",
    'Somewhat hard on myself, but recovers': "Non-judgment still matters, but less critically than for someone highly self-critical.",
    'Mildly hard on myself, mostly lets it go': "Non-judgment is a nice-to-have here rather than essential.",
    'Lets it go fairly easily': "Less of a constraint here — more flexibility in partner choice.",
  },
  seekshelp: {
    'Asks for help readily': "A more responsive, lighter-touch partner works fine.",
    'Usually asks for help without too much delay': "A fairly responsive partner works fine, with occasional light check-ins.",
    'Only asks once things are already difficult': "A partner who checks in proactively rather than waiting to be asked.",
    'Rarely asks, mostly waits to be checked on': "A partner who checks in proactively and consistently — waiting to be asked won't work well here.",
    'Resists asking until help is offered': "A partner who initiates consistently — proactivity is essential, not optional, for this person.",
  },
};

// Context dimensions — free text, not scored, carried through as-is.
const CONTEXT_FIELDS = [
  { id:'energiser', label:'What gives you energy', prompt:"What's one thing that reliably gives you energy?" },
  { id:'drainer', label:'What drains your energy', prompt:"What's one thing that reliably drains it?" },
  { id:'livetension', label:'The live tension needing support', prompt:"What's the one thing right now where a bit of outside accountability would actually make a difference?" },
  { id:'channel', label:'How you\u2019d want to stay in touch', prompt:'How would you want to stay in touch with a partner?' },
  { id:'frequency', label:'How often', prompt:'And roughly how often?' },
];

// Section A — universal baseline, always asked of every prospective partner.
const SECTION_A = [
  { id:'a1', q:'When someone comes to you with a problem, is your instinct to offer a solution, or to ask them more about it first?', tests:'Ask questions rather than advise',
    options:['I usually offer a solution or advice right away','I lean toward offering a solution, but sometimes ask first','It depends on the situation','I lean toward asking more before offering anything','I usually ask more about what happened before offering anything'] },
  { id:'a2', q:'Someone shares a setback with you. Do you tend to respond with curiosity, or do you notice yourself quietly forming a judgment?', tests:'Curiosity, not judgment, on setbacks',
    options:['I stay curious, without judging','Mostly curious, with occasional judgment creeping in','It varies','I often notice myself quietly judging, even if I don\'t say it','I notice myself judging fairly quickly, before curiosity kicks in'] },
  { id:'a3', q:'Think of a time you noticed the same issue coming up for someone more than once. What did you do with that?', tests:"Reflect patterns back, don't just record them" },
  { id:'a4', q:"After you ask someone a real question, what's your natural instinct while they sit with it?", tests:'Comfort with silence (style, not right/wrong)',
    options:['I tend to fill the silence myself pretty quickly','I usually jump in if the pause runs long','It depends on the moment','I\'m fairly comfortable letting a pause run its course','I\'m very comfortable sitting in silence for as long as it takes'] },
  { id:'a5', q:'Do you tend to remember what matters to people without being reminded, or is that something you have to work at?', tests:'Remember what mattered last time',
    options:['I remember without being reminded','I mostly remember, with occasional lapses','Somewhere in between','I often forget unless something jogs my memory','I have to make a real effort to remember'] },
  { id:'a6', q:'Think of a time someone confided something they were struggling with. Afterwards — did you keep it private, mention it to anyone else, bring it up with them again later, or something else?', tests:'Confidentiality' },
  { id:'a7', q:"If someone you were supporting didn't make progress on something for weeks, how would you feel about that — and whose responsibility would it feel like?", tests:'Not responsible for outcomes — only for showing up well' },
  { id:'a8', q:'When you\u2019re trying to help someone, how do you usually find out what kind of support they actually want — do you ask directly, or go with your best read of the situation?', tests:"Ask which zone, don't assume",
    options:['I always ask directly what kind of support they want','I usually ask, but sometimes go with my best guess','A mix of both, depending on the moment','I usually go with my best guess, but will ask if unsure','I go with my best read of the situation, rather than asking directly'] },
  { id:'a9', q:'What would you like to get out of this?', tests:'What sustains it for them (style — reciprocity itself is assumed necessary, this is about its form)',
    options:['The satisfaction of genuinely helping someone else','My own accountability, supported in return by them','A real friendship or connection growing out of it','What I learn myself, working through their situation alongside them','Not sure yet — I\'d want to find out as we go'] },
];

// Section B — coachee-specific fit. Each keyed to the dimension it checks;
// only shown to a partner if that dimension is present in the coachee's file.
const SECTION_B = {
  challenge: { q:"When someone tells you they've fallen short of something they wanted to do, how would you naturally want to help them process it — move fairly quickly toward what's next, spend time first understanding what happened, or something else?" },
  zone: { q:"If someone you were supporting kept missing something they'd committed to, what would you naturally want to do — push them to get back on track, slow down and explore what's getting in the way, or something else?" },
  // Genuinely open-ended already — not a wording problem. A coach's trained instinct
  // and personal style tend to converge after years of practice, which no rewrite can
  // separate back out. Treated as a known limitation of self-report, not fixed here.
  challenge_style: { q:'How would you describe your own default style when someone disagrees with you or pushes back?' },
  seekshelp: { q:"When it comes to checking in with someone you're supporting, what's your natural style — reaching out on your own initiative, waiting for them to come to you, or something in between?" },
  general: { q:'Is there a pattern you already know about yourself that might get in the way of being a good accountability partner — and would you be willing to name it to the other person up front?' },
};

// ── Storage ──────────────────────────────────────────────────
function load(key) { try { return JSON.parse(localStorage.getItem(key)); } catch(e) { return null; } }
function save(key, val) { localStorage.setItem(key, JSON.stringify(val)); }
function escapeHtml(s) { return (s==null?'':String(s)).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function today() { return new Date().toISOString().slice(0,10); }
function fmtDate(d) { if (!d) return ''; const dt = new Date(d+'T00:00:00'); return dt.toLocaleDateString('en-GB',{day:'numeric',month:'short',year:'numeric'}); }
function uid() { return Date.now().toString(36) + Math.random().toString(36).slice(2,8); }
function dimensionAnswerLabel(dimId, value) {
  const dim = DIMENSIONS.find(d=>d.id===dimId);
  return (dim && dim.optionLabels && dim.optionLabels[value]) ? dim.optionLabels[value] : value;
}

function triggerDownload(filename, text) {
  const blob = new Blob([text], { type:'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = filename;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  setTimeout(()=>URL.revokeObjectURL(url), 1000);
}

let currentView = 'home';
let pendingUploadData = null; // holds a parsed file between upload and the next screen
let currentComparisonEntryId = null; // which acc_comparison_history entry is open (coachee side)
let currentPartnerLogId = null; // which acc_partner_sent_log entry is open (partner side)

function go(view) { currentView = view; render(); window.scrollTo(0,0); }

function render() {
  const renders = {
    home: renderHome,
    manage: renderManage,
    'coachee-quiz': renderCoacheeQuiz,
    'coachee-dashboard': renderCoacheeDashboard,
    'coachee-manage': renderCoacheeManage,
    'coachee-combined': renderCombinedView,
    'partner-setup': renderPartnerSetup,
    'partner-dashboard': renderPartnerDashboard,
    'partner-send': renderPartnerSend,
    'partner-log-new': renderPartnerLogNew,
    'partner-sent-log': renderPartnerSentLog,
    'partner-sent-detail': renderPartnerSentDetail,
  };
  (renders[currentView] || renderHome)();
}

// ── Home / mode selector ─────────────────────────────────────
function renderHome() {
  document.getElementById('app').innerHTML = `
    <div class="eyebrow">Being · Becoming · Accompanying</div>
    <h1>Accompanying</h1>
    <div class="tagline">Figure out what kind of accountability partner would genuinely serve you — and check whether a real person is actually a good fit, not just a well-meaning one.</div>
    <div class="mode-choice">
      <button class="mode-btn" onclick="go('coachee-dashboard')">
        <div class="t">I'm looking for an accountability partner</div>
        <div class="d">Answer a short set of questions about yourself, get a plain-language sense of what to look for, and check a real candidate against it.</div>
      </button>
      <button class="mode-btn" onclick="go('partner-dashboard')">
        <div class="t">I've been asked to be someone's accountability partner</div>
        <div class="d">Complete a short brief about your own style, and see how it lines up with what they need.</div>
      </button>
    </div>
    <button class="btn btn-block" style="margin-top:.5rem" onclick="go('manage')">Manage your data</button>`;
}

// ── Manage hub — everything saved, in one place ───────────────
const DECISION_BADGE = { still_deciding:'Still deciding', moving_forward:'Moving forward', not_a_fit:'Not a fit' };
const OUTCOME_BADGE = { unknown:'Awaiting word', moving_forward:'Moving forward', not_selected:'Not selected' };

function renderManage() {
  const profile = load('acc_coachee_profile');
  const identity = load('acc_partner_identity');
  const history = load('acc_comparison_history') || [];
  const sentLog = load('acc_partner_sent_log') || [];
  let html = `<button class="back-link" onclick="go('home')">← Back</button><h1>Manage your data</h1>
    <div class="tagline">Everything you've saved in Accompanying, in one place.</div>
    <div class="section-label">Looking for an accountability partner</div>`;
  if (profile) {
    html += `<button class="manage-row" onclick="go('coachee-manage')">
      <div class="manage-row-title">Your profile</div>
      <div class="manage-row-meta">Last updated ${fmtDate(profile.savedDate)}</div>
    </button>`;
  } else {
    html += `<button class="manage-row" onclick="go('coachee-quiz')">
      <div class="manage-row-title">No profile yet</div>
      <div class="manage-row-meta">Answer the questions to get started</div>
    </button>`;
  }
  html += `<div class="section-label">Partner comparisons</div>`;
  if (history.length === 0) {
    html += `<div class="empty-state">No saved comparisons yet — these appear here once you upload a prospective partner's response.</div>`;
  } else {
    history.forEach(h => {
      html += `<button class="manage-row" onclick="openComparisonHistory('${h.id}')">
        <div class="manage-row-title">${h.partnerName?escapeHtml(h.partnerName):'Unnamed partner'}</div>
        <div class="manage-row-meta">Saved ${fmtDate(h.savedDate)} · ${DECISION_BADGE[h.decision]||'Still deciding'}</div>
      </button>`;
    });
  }
  html += `<div class="section-label">Being someone's accountability partner</div>`;
  if (identity) {
    html += `<button class="manage-row" onclick="go('partner-setup')">
      <div class="manage-row-title">${identity.name?escapeHtml(identity.name)+' — ':''}Your baseline</div>
      <div class="manage-row-meta">Last updated ${fmtDate(identity.savedDate)}</div>
    </button>`;
  } else {
    html += `<button class="manage-row" onclick="go('partner-setup')">
      <div class="manage-row-title">No baseline yet</div>
      <div class="manage-row-meta">Answer the baseline questions to get started</div>
    </button>`;
  }
  html += `<div class="section-label">Responses you've sent</div>`;
  if (sentLog.length === 0) {
    html += `<div class="empty-state">Nothing logged yet — this fills in each time you send a response and choose to record it.</div>`;
  } else {
    sentLog.forEach(e => {
      html += `<button class="manage-row" onclick="openPartnerSentDetail('${e.id}')">
        <div class="manage-row-title">${e.sentTo?escapeHtml(e.sentTo):'Unnamed'}</div>
        <div class="manage-row-meta">Sent ${fmtDate(e.sentDate)} · ${OUTCOME_BADGE[e.outcome]||'Awaiting word'}</div>
      </button>`;
    });
  }
  document.getElementById('app').innerHTML = html;
}

function saveComparisonHistory(partnerData) {
  const history = load('acc_comparison_history') || [];
  const entry = { id: uid(), partnerName: partnerData.partnerName || '', savedDate: today(), data: partnerData,
    notes: '', decision: 'still_deciding', toldThem: { sent:false, date:null, message:'' }, learnings: [] };
  history.unshift(entry);
  save('acc_comparison_history', history);
  return entry.id;
}

function getCurrentComparisonEntry() {
  const history = load('acc_comparison_history') || [];
  return history.find(h => h.id === currentComparisonEntryId);
}
function updateComparisonEntry(patch) {
  const history = load('acc_comparison_history') || [];
  const idx = history.findIndex(h => h.id === currentComparisonEntryId);
  if (idx === -1) return;
  history[idx] = Object.assign({}, history[idx], patch);
  save('acc_comparison_history', history);
}

function openComparisonHistory(id) {
  const history = load('acc_comparison_history') || [];
  const entry = history.find(h => h.id === id);
  if (!entry) { go('manage'); return; }
  currentComparisonEntryId = id;
  pendingUploadData = entry.data;
  go('coachee-combined');
}

// ── Coachee: quiz ────────────────────────────────────────────
function renderCoacheeQuiz() {
  const existing = load('acc_coachee_profile');
  const dims = existing ? existing.dimensionAnswers : {};
  const ctx = existing ? existing.contextAnswers : {};
  let html = `
    <button class="back-link" onclick="go('coachee-dashboard')">← Back</button>
    <h1>A few questions about you</h1>
    <div class="tagline">Answered once, reused for as many prospective partners as you want to consider. Nothing here is shared until you deliberately export it.</div>`;
  DIMENSIONS.forEach(d => {
    html += `<div class="field-group">
      <label class="field-label">${escapeHtml(d.label)}</label>
      <div class="guide-q" style="font-size:13px;margin:.15rem 0 .5rem">"${escapeHtml(d.guideQ)}"</div>
      <select id="dim_${d.id}">
        <option value="">— Choose —</option>
        ${d.options.map(o=>`<option value="${escapeHtml(o)}" ${dims[d.id]===o?'selected':''}>${escapeHtml(d.optionLabels?d.optionLabels[o]:o)}</option>`).join('')}
      </select>
    </div>`;
  });
  CONTEXT_FIELDS.forEach(f => {
    html += `<div class="field-group">
      <label class="field-label">${escapeHtml(f.label)}</label>
      <div class="guide-q" style="font-size:13px;margin:.15rem 0 .5rem">"${escapeHtml(f.prompt)}"</div>
      <textarea id="ctx_${f.id}">${escapeHtml(ctx[f.id]||'')}</textarea>
    </div>`;
  });
  html += `<button class="btn btn-primary btn-block" onclick="saveCoacheeProfile()">Save my answers</button>`;
  document.getElementById('app').innerHTML = html;
}

function saveCoacheeProfile() {
  const dimensionAnswers = {};
  let allAnswered = true;
  DIMENSIONS.forEach(d => {
    const v = document.getElementById('dim_'+d.id).value;
    if (!v) allAnswered = false;
    dimensionAnswers[d.id] = v;
  });
  if (!allAnswered) { alert('Please answer every question — each one feeds directly into what to look for in a partner.'); return; }
  const contextAnswers = {};
  CONTEXT_FIELDS.forEach(f => { contextAnswers[f.id] = document.getElementById('ctx_'+f.id).value.trim(); });
  const profile = { id: (load('acc_coachee_profile')||{}).id || uid(), savedDate: today(), dimensionAnswers, contextAnswers };
  save('acc_coachee_profile', profile);
  go('coachee-dashboard');
}

function recommendationList(dimensionAnswers) {
  return DIMENSIONS.map(d => {
    const answer = dimensionAnswers[d.id];
    const text = answer && RECOMMENDATION[d.id] ? RECOMMENDATION[d.id][answer] : null;
    return { id:d.id, label:d.label, answer, text };
  }).filter(r=>r.text);
}

// Same as recommendationList, but surfaces a dimension whose saved answer no
// longer matches any current option (e.g. after a wording update) instead of
// silently dropping it — so "What to look for" never just quietly loses a card.
function recommendationListWithStale(dimensionAnswers) {
  return DIMENSIONS.map(d => {
    const answer = dimensionAnswers[d.id];
    if (!answer) return null;
    const text = RECOMMENDATION[d.id] ? RECOMMENDATION[d.id][answer] : null;
    if (!text) return { id:d.id, label:d.label, stale:true };
    return { id:d.id, label:d.label, answer, text };
  }).filter(Boolean);
}

// ── Coachee: dashboard ───────────────────────────────────────
function renderCoacheeDashboard() {
  const profile = load('acc_coachee_profile');
  let html = `<button class="back-link" onclick="go('home')">← Back</button><h1>Looking for an accountability partner</h1>`;
  if (!profile) {
    html += `<div class="tagline">Start by answering a short set of questions about yourself — about 5 minutes.</div>
      <button class="btn btn-primary btn-block" onclick="go('coachee-quiz')">Answer the questions</button>`;
    document.getElementById('app').innerHTML = html;
    return;
  }
  html += `<div class="tagline">Last updated ${fmtDate(profile.savedDate)}.</div>`;
  const recs = recommendationListWithStale(profile.dimensionAnswers);
  html += `<div class="section-label">What to look for</div>
    <div class="card-sm" style="background:var(--accent-lt);border-color:var(--accent-lt)">Based on the answers you gave on ${fmtDate(profile.savedDate)}.</div>`;
  recs.forEach(r => {
    if (r.stale) {
      html += `<div class="card-sm" style="border-color:#E0B3B3"><strong>${escapeHtml(r.label)}</strong><br><span style="color:#B33;font-size:13px">Your saved answer for this one doesn't match the current options — please re-answer it.</span></div>`;

      html += `<div class="card-sm"><strong>${escapeHtml(r.label)}</strong> — ${escapeHtml(dimensionAnswerLabel(r.id, r.answer))}<br><span style="color:var(--text2);font-size:13px">${escapeHtml(r.text)}</span></div>`;
    }
  });
  html += `
    <div class="section-label">Comparing a prospective accountability partner?</div>
    <div class="card-sm">Ask them to open Accompanying, complete (or reuse) their own profile, and send you their response file.</div>

}

function clearCoacheeProfile() {
  if (!confirm('This permanently deletes your saved answers and recommendation. This cannot be undone. Continue?')) return;
  localStorage.removeItem('acc_coachee_profile');
  go('home');
}

// ── Coachee: upload a partner's response, then combined view ─
// Option A: there's no coachee-side export leg any more. The partner's
// response is generated purely from their own saved baseline (see the
// partner-send flow below), so there's nothing for the coachee to send
// first — they only ever upload what a partner sends back.
function handlePartnerResponseUpload(input) {
  const file = input.files[0]; if (!file) return;
  const reader = new FileReader();
  reader.onload = e => {
    try {
      const data = JSON.parse(e.target.result);
      if (data.type !== 'accompanying_partner_response') { alert('This doesn\'t look like an Accompanying partner response file.'); return; }
      currentComparisonEntryId = saveComparisonHistory(data);
      pendingUploadData = data;
      go('coachee-combined');
    } catch(err) { alert('Could not read that file — is it the right one?'); }
  };
  reader.readAsText(file);
}

// Where a dimension has no direct Section B question, this is the closest genuine
// cousin already sitting in Section A — a real related answer, not a guess, and much
// more useful than an empty placeholder. Saboteur has no natural cousin, so it's left
// out deliberately rather than forced.
const CLOSEST_RELATED_A = {
  processing: 'a4',      // let a question sit <-> processing style
  followthrough: 'a5',   // remembers what mattered <-> follow-through tendency
  selfcriticism: 'a2',   // curiosity, not judgment <-> self-criticism tendency
  vulnerability: 'a6',   // confidentiality (what they did with a disclosure) <-> vulnerability
};

// Six of the nine baseline questions encode established coaching practice, so a
// genuinely stronger/weaker answer exists for those — the other three are style
// (a4, a5 — already compared against the coachee's own answer in "Specific to
// you"; a9 has no coachee-side equivalent at all). Keeping this split explicit
// stops the guidance here from leaking into questions that are fit, not merit.
const SECTION_A_GUIDANCE = {
  a1: ["Leans away from what's generally recommended — advising first is a common instinct, but worth raising directly if it shows up often.",
       "Leans slightly away from established practice, though not strongly.",
       "A flexible middle ground — neither clearly toward nor away from established practice.",
       "Leans toward established practice.",
       "Matches established coaching practice well."],
  a2: ["Matches established coaching practice well.",
       "Leans toward established practice, with some room for judgment to creep in.",
       "A flexible middle ground.",
       "Leans away from established practice — judgment surfacing fairly often is worth a direct conversation.",
       "Leans away from what's generally recommended — worth a direct conversation."],
  a8: ["Matches established coaching practice well.",
       "Leans toward established practice.",
       "A flexible middle ground.",
       "Leans away from established practice — assuming rather than asking is worth raising.",
       "Leans away from what's generally recommended — worth a direct conversation before deciding."],
};
// Free-text answers can't be honestly auto-scored — this is a steer for the
// coachee's own read, not a verdict the tool is making on their behalf.
const SECTION_A_LOOKFOR = {
  a3: "A strong answer describes actually reflecting the pattern back to the person — not just noting it privately, and not just offering a fix.",
  a6: "A strong answer is specific about keeping it private — no vague reassurance, and no version of the story surfacing elsewhere.",
  a7: "A strong answer treats their own responsibility as showing up well, not as fixing the outcome — watch for guilt or over-ownership creeping in.",
};
const SECTION_A_GUIDED_IDS = ['a1','a2','a3','a6','a7','a8'];

function renderCombinedView() {
  const profile = load('acc_coachee_profile');
  const partner = pendingUploadData;
  if (!profile || !partner) { go('coachee-dashboard'); return; }
  const recs = recommendationList(profile.dimensionAnswers);

  let html = `<button class="back-link" onclick="go('coachee-dashboard')">← Back</button><h1>Side by side</h1>
    <div class="card" style="background:var(--accent-lt);border-color:var(--accent)">
      <strong>There's no score here on purpose</strong> for the "Specific to you" section below. Read through those rows and notice where their answer feels reassuring, and where it feels like something worth raising directly with them before deciding. One or two answers that don't quite match isn't disqualifying — it might just be the actual thing worth talking about first.
    </div>
    <div class="section-label">Universal baseline — how they say they generally operate</div>
    <div class="card-sm" style="background:var(--accent-lt);border-color:var(--accent-lt)">
      Six of these reflect established coaching practice, so we've added a note on where their answer falls. The rest are style, not merit — you'll find those compared elsewhere on this page.
    </div>`;
  SECTION_A_GUIDED_IDS.forEach(id => {
    const q = SECTION_A.find(x => x.id === id);
    const ans = partner.sectionAAnswers ? partner.sectionAAnswers[id] : null;
    let guidance = '';
    if (SECTION_A_GUIDANCE[id] && ans) {
      const idx = q.options ? q.options.indexOf(ans) : -1;
      if (idx > -1) guidance = SECTION_A_GUIDANCE[id][idx];
    } else if (SECTION_A_LOOKFOR[id]) {
      guidance = SECTION_A_LOOKFOR[id];
    }
    html += `<div class="card-sm"><div style="font-size:12px;color:var(--text3);margin-bottom:2px">${escapeHtml(q.q)}</div>${escapeHtml(ans||'(not answered)')}${guidance?`<div style="font-size:12px;color:var(--accent-dk);margin-top:6px">${escapeHtml(guidance)}</div>`:''}</div>`;
  });

  html += `<div class="section-label" style="margin-top:1rem">Compared elsewhere on this page</div>`;
  Object.keys(CLOSEST_RELATED_A).forEach(dimId => {
    const id = CLOSEST_RELATED_A[dimId];
    if (id !== 'a4' && id !== 'a5') return; // only the two style baseline questions belong in this group
    const q = SECTION_A.find(x => x.id === id);
    const ans = partner.sectionAAnswers ? partner.sectionAAnswers[id] : null;
    html += `<div class="card-sm"><div style="font-size:12px;color:var(--text3);margin-bottom:2px">${escapeHtml(q.q)}</div>${escapeHtml(ans||'(not answered)')}<div style="font-size:12px;margin-top:6px"><a href="#cmp-${dimId}" style="color:var(--accent-dk)">↓ compared against your own answer below</a></div></div>`;
  });

  html += `<div class="section-label" style="margin-top:1rem">Their perspective only</div>`;
  (() => {
    const q = SECTION_A.find(x => x.id === 'a9');
    const ans = partner.sectionAAnswers ? partner.sectionAAnswers['a9'] : null;
    html += `<div class="card-sm"><div style="font-size:12px;color:var(--text3);margin-bottom:2px">${escapeHtml(q.q)}</div>${escapeHtml(ans||'(not answered)')}<div style="font-size:12px;color:var(--text3);margin-top:6px">No equivalent question on your side — nothing to compare this against.</div></div>`;
  })();

  html += `<div class="section-label" style="margin-top:1rem">Specific to you</div>`;
  recs.forEach(r => {
    let partnerAns = null, note = null;
    if (SECTION_B[r.id] && partner.sectionBAnswers) {
      partnerAns = partner.sectionBAnswers[r.id];
    } else if (CLOSEST_RELATED_A[r.id] && partner.sectionAAnswers) {
      partnerAns = partner.sectionAAnswers[CLOSEST_RELATED_A[r.id]];
      note = 'Closest related answer, from their general baseline';
    }
    html += `<div class="compare-row" id="cmp-${r.id}">
      <div class="compare-col"><div class="lbl">What you need — ${escapeHtml(r.label)}</div>${escapeHtml(r.text)}</div>
      <div class="compare-col"><div class="lbl">${note?escapeHtml(note):'What they said'}</div>${partnerAns?escapeHtml(partnerAns):'<span style="color:var(--text3)">No related answer captured — worth asking about directly if it matters to you.</span>'}</div>
    </div>`;
  });

  html += `
    <div class="section-label">Share a snapshot</div>
    <textarea id="snapshotOut" readonly style="min-height:200px">${escapeHtml(buildSnapshotText(profile, partner, recs))}</textarea>
    <button class="btn btn-primary btn-block" style="margin-top:.5rem" onclick="copySnapshot(event)">Copy to clipboard</button>`;

  // ── Coachee's own notes, decision, and follow-through on this specific comparison ──
  const entry = getCurrentComparisonEntry();
  if (entry) {
    const decisionBtn = (val, lbl) => `<button class="btn btn-sm${entry.decision===val?' btn-primary':''}" onclick="setComparisonDecision('${val}')">${lbl}</button>`;
    html += `
      <div class="section-label" style="margin-top:1rem">Your notes on this comparison</div>
      <textarea id="comparisonNotes" placeholder="Good/less good things, anything to watch for...">${escapeHtml(entry.notes||'')}</textarea>
      <button class="btn btn-block" style="margin-top:.4rem" onclick="saveComparisonNotes()">Save notes</button>

      <div class="section-label" style="margin-top:1rem">Is this a fit?</div>
      <div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:.6rem">
        ${decisionBtn('still_deciding','Still deciding')}
        ${decisionBtn('moving_forward','Moving forward')}
        ${decisionBtn('not_a_fit','Not a fit')}
      </div>

      <div class="section-label" style="margin-top:1rem">Have you let them know?</div>`;
    if (!entry.toldThem || !entry.toldThem.sent) {
      html += `<div class="card-sm">This part's on you — Accompanying won't draft anything here. A considered, personal reply matters more than a templated one.</div>
        <button class="btn btn-block" onclick="markToldThem()">I've let them know</button>`;
    } else {
      html += `<div class="card-sm">Told them on ${fmtDate(entry.toldThem.date)}.</div>
        <textarea id="toldThemMessage" placeholder="Optionally paste what you actually said, for your own record">${escapeHtml(entry.toldThem.message||'')}</textarea>
        <button class="btn btn-block" style="margin-top:.4rem" onclick="saveToldThemMessage()">Save</button>`;
    }

    if (entry.decision === 'moving_forward') {
      html += `<div class="section-label" style="margin-top:1rem">Learnings from working together</div>`;
      (entry.learnings||[]).forEach(l => {
        html += `<div class="card-sm"><div style="font-size:11px;color:var(--text3)">${fmtDate(l.date)}</div>${escapeHtml(l.text)}</div>`;
      });
      html += `<textarea id="newComparisonLearning" placeholder="What's worth remembering, for this pairing or future ones?"></textarea>
        <button class="btn btn-block" style="margin-top:.4rem" onclick="addComparisonLearning()">Add learning</button>`;
    }
  }

  document.getElementById('app').innerHTML = html;
}

function saveComparisonNotes() {
  const notes = document.getElementById('comparisonNotes').value;
  updateComparisonEntry({ notes });
  go('coachee-combined');
}
function setComparisonDecision(decision) {
  updateComparisonEntry({ decision });
  go('coachee-combined');
}
function markToldThem() {
  updateComparisonEntry({ toldThem: { sent:true, date: today(), message:'' } });
  go('coachee-combined');
}
function saveToldThemMessage() {
  const entry = getCurrentComparisonEntry();
  const message = document.getElementById('toldThemMessage').value;
  updateComparisonEntry({ toldThem: Object.assign({}, entry.toldThem, { message }) });
  go('coachee-combined');
}
function addComparisonLearning() {
  const text = document.getElementById('newComparisonLearning').value.trim();
  if (!text) return;
  const entry = getCurrentComparisonEntry();
  const learnings = (entry.learnings||[]).concat([{ date: today(), text }]);
  updateComparisonEntry({ learnings });
  go('coachee-combined');
}

function buildSnapshotText(profile, partner, recs) {
  const lines = [`Accompanying — combined view (${fmtDate(today())})`, ''];
  lines.push('WHAT I NEED');
  recs.forEach(r => lines.push(`- ${r.label}: ${r.text}`));
  lines.push('');
  lines.push('WHAT THEY SAID (universal baseline)');
  SECTION_A.forEach(q => lines.push(`- ${q.q} — ${(partner.sectionAAnswers && partner.sectionAAnswers[q.id]) || '(not answered)'}`));
  return lines.join('\n');
}
function copySnapshot(evt) {
  const ta = document.getElementById('snapshotOut');
  ta.focus(); ta.select();
  try { document.execCommand && document.execCommand('copy'); } catch(e) {}
  if (navigator.clipboard) navigator.clipboard.writeText(ta.value).catch(()=>{});
  const btn = evt.target; const old = btn.textContent; btn.textContent = '✓ Copied'; setTimeout(()=>btn.textContent=old, 1500);
}

function renderPartnerSetup() {

      <input type="text" id="partnerName" value="${escapeHtml(existing?existing.name||'':'')}"></div>`;
  SECTION_A.forEach(q => {
    html += `<div class="field-group">

      ${q.options

  document.getElementById('app').innerHTML = html;
}

function savePartnerIdentity() {
  const sectionAAnswers = {};
  let allAnswered = true;
  SECTION_A.forEach(q => { const v = document.getElementById('a_'+q.id).value.trim(); if (!v) allAnswered = false; sectionAAnswers[q.id] = v; });
  const sectionBAnswers = {};
  Object.keys(SECTION_B).forEach(key => { const v = document.getElementById('b_'+key).value.trim(); if (!v) allAnswered = false; sectionBAnswers[key] = v; });
  if (!allAnswered) { alert('Please answer everything — all of this is included whenever you send a response.'); return; }
  save('acc_partner_identity', { name: document.getElementById('partnerName').value.trim(), sectionAAnswers, sectionBAnswers, savedDate: today() });
  go('partner-dashboard');
}

    });
    html += `<textarea id="newPartnerLearning" placeholder="What's worth remembering, for this pairing or future ones?"></textarea>
      <button class="btn btn-block" style="margin-top:.4rem" onclick="addPartnerLearning()">Add learning</button>`;
  }
  document.getElementById('app').innerHTML = html;
}
function setPartnerLogOutcome(outcome) { updatePartnerLogEntry({ outcome }); go('partner-sent-detail'); }
function addPartnerLearning() {
  const text = document.getElementById('newPartnerLearning').value.trim();
  if (!text) return;
  const entry = getCurrentPartnerLogEntry();
  const learnings = (entry.learnings||[]).concat([{ date: today(), text }]);
  updatePartnerLogEntry({ learnings });
  go('partner-sent-detail');
}

render();
document.getElementById('footerYear').textContent = new Date().getFullYear();

</script>
</body>
</html>
